[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "music-organizer"
version = "0.1.0"
description = "Terminal UI that fixes music metadata, album art and filenames using free online sources"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
    "mutagen>=1.47",
    "pillow>=10.1",
    "httpx>=0.27",
    "unidecode>=1.3",
    "indic-transliteration>=2.3",
    "rapidfuzz>=3.0",
    "textual-image>=0.8",
]

[project.scripts]
music-organizer = "music_organizer.__main__:main"

[tool.setuptools.packages.find]
include = ["music_organizer*"]

[tool.setuptools.package-data]
music_organizer = ["*.tcss"]
